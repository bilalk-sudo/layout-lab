<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Layout Lab</title><meta name="robots" content="noindex"><meta name="theme-color" content="#3346E0"><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: a settings sheet of icon tiles on top, a contact sheet of wireframes below, a side drawer for the chosen layout. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --well:#ECEEEA; --line:#DEE1DB; --line-strong:#C6CBC3;
  --ink:#161917; --muted:#62685F; --accent:#3346E0; --accent-soft:#E9EBFD; --accent-ink:#2232B5;
  --crop:#D9473F; --shadow:0 1px 2px rgba(20,24,20,.05),0 8px 24px rgba(20,24,20,.06);
  --wf-canvas:#FFFFFF; --wf-line:#D5D9D2; --wf-ink:#262A27; --wf-ink2:#A6ABA3;
  --wf-vis:#D7DEF6; --wf-vis2:#AFBCEA; --wf-icon:#E6E0F7; --wf-icon2:#B9AAE6;
  --wf-badge:#F0B93A; --wf-panel:#FFFFFF; --wf-tile:#EEF0EB; --wf-block:#F1CBB6;
  --wf-inv:#FFFFFF; --wf-inv2:rgba(255,255,255,.72); --wf-on-accent:#FFFFFF;
  --wf-solid:#EEF0F6; --wf-g1:#E3E7FB; --wf-g2:#FBE8DD; --wf-photo:#C3CAC0; --wf-photo2:#A9B1A6;
  --wf-dot:#D2D6DE; --wf-shape:#DCE2F6; --wf-scrim:#0E1220;
  --font-ui:'Geist', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono:'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1110; --surface:#171A18; --well:#121513; --line:#2A2E2B; --line-strong:#3B403C;
    --ink:#ECEFEA; --muted:#9AA098; --accent:#8794FF; --accent-soft:#222746; --accent-ink:#BAC2FF;
    --crop:#F06A61; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --wf-canvas:#222624; --wf-line:#3A3F3B; --wf-ink:#E4E7E2; --wf-ink2:#6F756E;
    --wf-vis:#2C3555; --wf-vis2:#46528A; --wf-icon:#372F52; --wf-icon2:#6A5AA6;
    --wf-badge:#D7A332; --wf-panel:#2D322F; --wf-tile:#2A2F2C; --wf-block:#5B3B2D;
    --wf-inv:#FFFFFF; --wf-inv2:rgba(255,255,255,.7); --wf-on-accent:#121433;
    --wf-solid:#262B33; --wf-g1:#283050; --wf-g2:#4A3228; --wf-photo:#3A403B; --wf-photo2:#4B524C;
    --wf-dot:#363C45; --wf-shape:#2E3650; --wf-scrim:#05070D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1110; --surface:#171A18; --well:#121513; --line:#2A2E2B; --line-strong:#3B403C;
  --ink:#ECEFEA; --muted:#9AA098; --accent:#8794FF; --accent-soft:#222746; --accent-ink:#BAC2FF;
  --crop:#F06A61; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --wf-canvas:#222624; --wf-line:#3A3F3B; --wf-ink:#E4E7E2; --wf-ink2:#6F756E;
  --wf-vis:#2C3555; --wf-vis2:#46528A; --wf-icon:#372F52; --wf-icon2:#6A5AA6;
  --wf-badge:#D7A332; --wf-panel:#2D322F; --wf-tile:#2A2F2C; --wf-block:#5B3B2D;
  --wf-inv:#FFFFFF; --wf-inv2:rgba(255,255,255,.7); --wf-on-accent:#121433;
  --wf-solid:#262B33; --wf-g1:#283050; --wf-g2:#4A3228; --wf-photo:#3A403B; --wf-photo2:#4B524C;
  --wf-dot:#363C45; --wf-shape:#2E3650; --wf-scrim:#05070D;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 104px;display:flex;flex-direction:column;gap:20px}

.topbar{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.top-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;align-items:center;gap:8px}
.theme-switch{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;color:var(--ink)}
.theme-switch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.theme-switch .track{position:relative;width:40px;height:22px;border-radius:999px;background:var(--well);border:1px solid var(--line-strong);transition:background .15s}
.theme-switch .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--ink);display:grid;place-items:center;color:var(--bg);transition:transform .18s}
.theme-switch .knob svg{width:11px;height:11px}
.theme-switch[aria-checked="true"] .knob{transform:translateX(18px)}
.theme-switch[aria-checked="true"] .track{background:var(--accent-soft);border-color:var(--accent)}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.brand h1{font-size:18px;font-weight:600;letter-spacing:-.01em;margin:0}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.summary{font-family:var(--font-mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-variant-numeric:tabular-nums}

.controls{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:16px 18px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-label{display:flex;flex-direction:column;gap:2px;padding-top:6px}
.row-label span{font-weight:600;font-size:13px}
.row-label small{color:var(--muted);font-size:12px;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-width:0;align-items:stretch}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-width:86px;padding:10px 10px 9px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;transition:border-color .12s,background .12s,color .12s;color:var(--ink)}
.chip:hover{border-color:var(--line-strong);background:var(--well)}
.chip:focus-visible,.icon-btn:focus-visible,.card:focus-visible,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip svg{width:22px;height:22px;flex:none}
.chip .chip-label{font-size:12px;font-weight:500;white-space:nowrap}
.chip .chip-sub{font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;margin-top:-4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip[aria-pressed="true"] .chip-sub{color:var(--accent-ink);opacity:.8}
.chip.wide{min-width:110px}
.divider{width:1px;align-self:stretch;background:var(--line);margin:0 4px}
.custom-size{display:flex;align-items:center;gap:6px;padding:0 4px;font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.custom-size input{width:78px;padding:8px 8px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);font-family:var(--font-mono);font-size:12.5px}
.hint{font-size:12px;color:var(--muted);align-self:center;padding-left:4px}

.results{display:flex;flex-direction:column;gap:14px}
.results-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.results-head h2{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
.results-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:border-color .12s,transform .12s;text-align:left;padding:0}
.card:hover{border-color:var(--line-strong)}
.card.is-selected{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card-preview{height:210px;background:var(--well);display:flex;align-items:center;justify-content:center;padding:16px}
.card-preview svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block;filter:drop-shadow(0 1px 2px rgba(0,0,0,.08))}
.card-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 12px;border-top:1px solid var(--line)}
.card-name{font-weight:550;font-size:13px;line-height:1.3;min-width:0}
.card-tag{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:1px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px;font-weight:500;flex:none}
.icon-btn:hover{background:var(--well);border-color:var(--line-strong)}
.icon-btn svg{width:15px;height:15px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--muted)}
.tab svg{width:15px;height:15px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
.tab-count{font-family:var(--font-mono);font-size:11px;background:var(--well);border:1px solid var(--line);border-radius:999px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums}
.card-actions{display:flex;gap:6px;flex:none}
.star-btn{padding:0 8px}
.star-btn[aria-pressed="true"]{color:var(--wf-badge);border-color:var(--wf-badge)}
.star-btn[aria-pressed="true"] svg{fill:currentColor}
.d-foot .star-btn{height:40px;padding:0 12px}
.empty{padding:48px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:12px}

.backdrop{position:fixed;inset:0;background:rgba(10,12,10,.35);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;box-shadow:-12px 0 40px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.d-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.eyebrow{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent-ink);font-weight:600}
.d-head h3{margin:2px 0 0;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.d-body{flex:1;overflow-y:auto;padding:16px 20px 20px;display:flex;flex-direction:column;gap:16px}
.d-preview{background:var(--well);border-radius:10px;padding:18px;display:flex;justify-content:center;align-items:center;height:340px}
.d-preview svg{max-width:100%;max-height:100%;width:auto;height:auto;display:block}
.d-desc{margin:0;color:var(--muted);line-height:1.55}
.d-fields{border:0;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.d-fields legend{font-weight:600;font-size:13px;margin-bottom:8px;padding:0}
.d-fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.d-fields label.full{grid-column:1/-1}
.d-fields input{padding:8px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-size:13px;min-width:0}
.d-fields input:focus,.prompt-box:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.prompt-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prompt-head span{font-weight:600;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--well)}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.prompt-box{width:100%;min-height:300px;resize:vertical;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--well);font-family:var(--font-mono);font-size:12px;line-height:1.55;color:var(--ink)}
.d-foot{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:flex-start;flex-wrap:wrap}
/* keep actions clear of the hosting badge pinned bottom-right */
@media (max-width:640px){.d-foot{padding-bottom:76px}.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.d-foot small{color:var(--muted);font-size:12px}
.btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:9px;border:0;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;font-size:13.5px}
:root[data-theme="dark"] .btn{color:var(--wf-on-accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:var(--wf-on-accent)}}
.btn svg{width:16px;height:16px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;transition:opacity .18s,transform .18s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:720px){
  .row{grid-template-columns:1fr;gap:10px;padding:14px}
  .row-label{padding-top:0;flex-direction:row;align-items:baseline;gap:8px}
  .chip{min-width:76px;padding:9px 8px 8px}
  .d-fields{grid-template-columns:1fr}
  .d-preview{height:260px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .card-preview{height:170px;padding:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><linearGradient id="icgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="currentColor"/><stop offset="1" stop-color="currentColor" stop-opacity=".12"/></linearGradient></defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="top-actions">
      <div class="summary" id="summary"></div>
      <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="Dark mode">
        <span id="theme-label">Light mode</span>
        <span class="track" aria-hidden="true"><span class="knob" id="theme-knob"></span></span>
      </button>
    </div>
  </header>

  <section class="controls" aria-label="Layout settings">
    <div class="row"><div class="row-label"><span>Size</span><small>Canvas dimensions</small></div><div class="chips" id="chips-size"></div></div>
    <div class="row"><div class="row-label"><span>Elements</span><small>What goes inside the creative</small></div><div class="chips" id="chips-els"></div></div>
    <div class="row"><div class="row-label"><span>Background</span><small>What sits behind everything</small></div><div class="chips" id="chips-bg"></div></div>
    <div class="row"><div class="row-label"><span>Style</span><small>The kind of layout you want</small></div><div class="chips" id="chips-style"></div></div>
    <div class="row"><div class="row-label"><span>Bleed / crop</span><small>Edges that will be cut off</small></div><div class="chips" id="chips-bleed"></div></div>
  </section>

  <section class="results" aria-live="polite">
    <div class="tabs" role="tablist" aria-label="Layout views">
      <button type="button" role="tab" class="tab" id="tab-all" aria-selected="true">All layouts</button>
      <button type="button" role="tab" class="tab" id="tab-fav" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>Favourites <span class="tab-count" id="fav-count">0</span></button>
    </div>
    <div class="results-head">
      <div><h2 id="res-count"></h2><p id="res-sub"></p></div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--wf-ink)"></i>Text</span>
        <span><i style="background:var(--wf-vis2)"></i>Visual</span>
        <span><i style="background:var(--accent)"></i>CTA</span>
        <span><i style="background:var(--wf-badge)"></i>Badge</span>
        <span><i style="background:repeating-linear-gradient(45deg,var(--crop) 0 2px,transparent 2px 4px)"></i>Crop zone</span>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</div>

<div class="backdrop" id="backdrop" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" aria-hidden="true">
  <div class="d-head">
    <div><p class="eyebrow" id="d-style"></p><h3 id="d-title">Layout</h3></div>
    <button class="icon-btn" id="d-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="d-body">
    <div class="d-preview" id="d-preview"></div>
    <p class="d-desc" id="d-desc"></p>
    <fieldset class="d-fields">
      <legend>Fill in the details (optional, added to the prompt)</legend>
      <label id="w-headline">Headline<input id="f-headline" type="text" placeholder="Your headline"></label>
      <label id="w-subheadline">Subheadline<input id="f-subheadline" type="text" placeholder="Supporting line"></label>
      <label id="w-cta">CTA text<input id="f-cta" type="text" placeholder="Learn more"></label>
      <label id="w-badge">Badge text<input id="f-badge" type="text" placeholder="Free webinar"></label>
      <label id="w-subject" class="full">What the visual shows<input id="f-subject" type="text" placeholder="e.g. a trader at a desk with charts on two monitors"></label>
      <label id="w-colours" class="full">Colours and brand notes<input id="f-colours" type="text" placeholder="e.g. navy and white with an orange CTA, clean sans-serif type"></label>
    </fieldset>
    <div class="prompt-head">
      <span>Layout prompt</span>
      <div class="seg" role="group" aria-label="Prompt format">
        <button type="button" id="fmt-prose" aria-pressed="true">Written brief</button>
        <button type="button" id="fmt-json" aria-pressed="false">JSON</button>
      </div>
    </div>
    <textarea class="prompt-box" id="d-prompt" readonly spellcheck="false"></textarea>
  </div>
  <div class="d-foot">
    <button class="btn" id="d-copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>Copy prompt</button>
    <button type="button" class="icon-btn star-btn" id="d-star" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg><span>Add to favourites</span></button>
  </div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- data ---------- */
const FORMATS=[
  {id:'square',name:'Square',w:1080,h:1080,use:'Feed post'},

/* ---------- geometry helpers ---------- */
const VIS=['image','person','icon'];
const MAIN=['badge','headline','subheadline','body','bullets','stat','testimonial','date','cta'];
const FULLW=new Set(['headline','subheadline','body','bullets','testimonial','disclaimer']);
const SPEC={logo:[.24,.07],badge:[.26,.055],headline:[1,.17],subheadline:[.9,.075],body:[.95,.1],bullets:[1,.16],stat:[.4,.13],testimonial:[1,.14],date:[.42,.05],cta:[.34,.085],url:[.4,.035],qr:[.13,.13],disclaimer:[1,.03]};
const GAP=c=>.025*c.m;
function spec(c,id,rw,o){
  const s=SPEC[id]; o=o||{};
  let h=s[1]*c.m; if(id==='headline') h*=(o.hk||1);
  const full=FULLW.has(id)||(id==='cta'&&o.ctaFull);
  const w=full? rw*(id==='cta'?1:s[0]) : Math.min(s[0]*c.m,rw);
  return {w,h};
}
function measure(c,ids,w,o){const it=ids.filter(c.has); if(!it.length) return 0; return it.reduce((s,id)=>s+spec(c,id,w,o).h,0)+GAP(c)*(it.length-1);}
function stack(c,R,ids,o){
  o=o||{};
  const it=ids.filter(c.has).map(id=>Object.assign({id},spec(c,id,R.w,o)));
  if(!it.length||R.h<=0||R.w<=0) return [];
  let g=GAP(c); let tot=it.reduce((s,i)=>s+i.h,0)+g*(it.length-1);
  const sc=tot>R.h? R.h/tot : (o.grow? Math.min(o.grow,R.h/tot):1);
  it.forEach(i=>{i.h*=sc; if(!(FULLW.has(i.id)||(i.id==='cta'&&o.ctaFull))) i.w=Math.min(i.w*sc,R.w);});
  g*=sc; tot*=sc;
  const al=o.align||'left';
  let y=R.y+(o.valign==='center'?(R.h-tot)/2:o.valign==='bottom'?R.h-tot:0);
  return it.map(i=>{
    const x=al==='left'?R.x:al==='right'?R.x+R.w-i.w:R.x+(R.w-i.w)/2;
    const b={id:i.id,x,y,w:i.w,h:i.h}; if(o.inv) b.inv=1; if(i.id==='cta'&&o.ctaLight) b.shape='light';
    y+=i.h+g; return b;
  });
}
const hasVis=c=>VIS.some(c.has);
function visuals(c,R,o){
  o=o||{};
  const v=VIS.filter(c.has); if(!v.length||R.w<=0||R.h<=0) return [];
  const out=[Object.assign({id:v[0],z:o.z!=null?o.z:.8},R,o.shape?{shape:o.shape}:{})];
  if(v.length>1){const s=Math.min(R.w,R.h)*.42; out.push({id:v[1],x:o.flip?R.x+R.w*.04:R.x+R.w-s-R.w*.04,y:R.y+R.h-s-R.h*.04,w:s,h:s,z:.9,shape:v[1]==='person'?'cutout':'rounded',secondary:1});}
  if(v.length>2){const s=Math.min(R.w,R.h)*.26; out.push({id:v[2],x:o.flip?R.x+R.w-s-R.w*.04:R.x+R.w*.04,y:R.y+R.h*.04,w:s,h:s,z:.9,shape:'rounded',secondary:1});}
  return out;
}
function logoAt(c,R,pos,o){
  if(!c.has('logo')) return {boxes:[],rest:R};
  const s=spec(c,'logo',R.w); const strip=s.h+.035*c.m;
  const x=pos[1]==='l'?R.x:pos[1]==='r'?R.x+R.w-s.w:R.x+(R.w-s.w)/2;
  const b={id:'logo',x,y:pos[0]==='t'?R.y:R.y+R.h-s.h,w:s.w,h:s.h}; if(o&&o.inv) b.inv=1;
  return {boxes:[b],rest:pos[0]==='t'?{x:R.x,y:R.y+strip,w:R.w,h:R.h-strip}:{x:R.x,y:R.y,w:R.w,h:R.h-strip}};
}
function footer(c,R,align,o){
  const m=c.m, out=[]; o=o||{};
  const qh=c.has('qr')?.13*m:0, uh=c.has('url')?.035*m:0, dh=c.has('disclaimer')?.03*m:0, g=.02*m;
  const rowH=Math.max(qh,uh); const tot=rowH+dh+(rowH&&dh?g:0);
  if(!tot) return {boxes:[],rest:R};
  const top=R.y+R.h-tot;
  if(uh){const w=Math.min(.4*m,R.w*.6); out.push({id:'url',x:align==='center'&&!qh?R.x+(R.w-w)/2:R.x,y:top+rowH-uh,w,h:uh});}
  if(qh) out.push({id:'qr',x:R.x+R.w-qh,y:top,w:qh,h:qh});
  if(dh) out.push({id:'disclaimer',x:R.x,y:R.y+R.h-dh,w:R.w,h:dh});
  if(o.inv) out.forEach(b=>b.inv=1);

}
function split(c,R,f,dir){const g=.05*c.m; if(dir==='h'){const w1=(R.w-g)*f; return [{x:R.x,y:R.y,w:w1,h:R.h},{x:R.x+w1+g,y:R.y,w:R.w-w1-g,h:R.h}];} const h1=(R.h-g)*f; return [{x:R.x,y:R.y,w:R.w,h:h1},{x:R.x,y:R.y+h1+g,w:R.w,h:R.h-h1-g}];}
const inset=(R,p)=>({x:R.x+p,y:R.y+p,w:R.w-2*p,h:R.h-2*p});

  o=o||{}; const gap=.04*c.m, al=o.align||'left';

  else if(th>0) sc=Math.min(1,(R.h-gaps)/th);
  const used=th*sc+vh*nv+gaps;
  let y=R.y+(o.valign==='center'?Math.max(0,(R.h-used)/2):o.valign==='bottom'?Math.max(0,R.h-used):0);
  const out=[];
  for(const p of parts){
    if(p.vis){ const w=R.w*(p.wf||1); const x=al==='left'?R.x:al==='right'?R.x+R.w-w:R.x+(R.w-w)/2; out.push(...visuals(c,{x,y,w,h:vh},p)); y+=vh+gap; }
    else{ const h=p.nat*sc; const x=al==='left'?R.x:al==='right'?R.x+R.w-p.w:R.x+(R.w-p.w)/2; out.push(...stack(c,{x,y,w:p.w,h},p.ids,Object.assign({},o,p,{valign:'top'}))); y+=h+gap; }

  const s=it.map(id=>Object.assign({id},sz(id)));
  let tot=s.reduce((a,b)=>a+b.w,0)+g*(s.length-1); const k=tot>R.w?R.w/tot:1;
  s.forEach(b=>{b.w*=k;b.h*=Math.max(k,.6);});

}

function bannerLine(c,R,o){
  const out=[],h=R.h,g=h*.35;let x1=R.x,x2=R.x+R.w;
  if(c.has('logo')){const lh=h*.48,lw=Math.min(lh*3,R.w*.2);out.push({id:'logo',x:x1,y:R.y+(h-lh)/2,w:lw,h:lh,inv:o.inv?1:0});x1+=lw+g;}
  const right=row(c,{x:R.x,y:R.y,w:R.w*.4,h},['qr','cta'],{justify:'start'});
  const rw=right.length?right[right.length-1].x+right[right.length-1].w-R.x:0;
  right.forEach(b=>{b.x+=R.x+R.w-rw-R.x; if(b.id==='qr'&&o.inv) b.inv=1;});out.push(...right);if(rw) x2-=rw+g;
  let tw=x2-x1;if(o.textMax) tw=Math.min(tw,o.textMax-(x1-R.x));
  let T={x:x1,y:R.y,w:tw,h};

    case 'body':notes.push('Body copy: 2 to 3 short lines of supporting text in regular weight.');break;
    case 'bullets':notes.push('Three short bullet points, each with a small tick or dot icon, left aligned.');break;
    case 'cta':notes.push(`CTA button with the text ${t(txt('cta'))||'"Learn more"'}. Solid, high-contrast button with rounded corners${b.shape==='light'?', light button on the coloured bar':''}${b.w>c.W*.6?', full width':''}.`);break;
    case 'image':notes.push(`${b.secondary?'Secondary image':'Main hero image'}${txt('subject')&&!b.secondary?': '+txt('subject'):''}.`);break;
    case 'person':notes.push(b.shape==='cutout'?'Cut-out photo of a person (head and shoulders, no background) overlapping the main visual, looking toward the headline.':`Photo of a person, head and shoulders${txt('subject')&&!b.secondary?' ('+txt('subject')+')':''}, looking toward the headline.`);break;
    case 'icon':notes.push('Simple flat illustration or icon that supports the message.');break;
    case 'badge':notes.push(`${b.shape==='sticker'?'Round sticker':'Small pill-shaped tag'} with the text ${t(txt('badge'))||'"[tag text]"'}, in a bright accent colour.`);break;
    case 'date':notes.push('Date and time on one line with a small calendar icon, e.g. "[Day, Date | Time]".');break;
    case 'stat':notes.push(`${b.shape==='sticker'?'Round sticker holding one':'One'} large number with a short caption under it, e.g. "[number] [caption]".`);break;
    case 'testimonial':notes.push('Short testimonial quote in quotation marks, with the person\'s name and role in smaller text underneath.');break;
    case 'url':notes.push('Website URL in small text.');break;
    case 'qr':notes.push('Square QR code placeholder (plain, to be replaced with the real code).');break;
    case 'disclaimer':notes.push('One line of small fine print or disclaimer text.');break;
  }
  if(['image','person','icon'].includes(id)&&b.shape&&b.shape!=='cutout'){notes.push({circle:'Cropped into a circle.',rounded:'Rounded corners.','diag-l':'Its left edge is cut on a strong diagonal.','diag-r':'Its right edge is cut on a strong diagonal.','diag-b':'Its bottom edge is cut on a strong diagonal.','diag-t':'Its top edge is cut on a strong diagonal.'}[b.shape]||'');}
  if(b.inv) notes.push('White or light text, sitting on the darker area.');
  const oe=offEdge(b,c);if(oe.length) notes.push(`Runs off the ${oe.join(' and ')} edge of the canvas.`);
  return notes.filter(Boolean).join(' ');
}
const DECOR_BRIEF={
  scrim:'A dark gradient overlay on the image behind the copy, fading from transparent to about 80% dark so the white text stays readable.',
  panel:'A solid light card with softly rounded corners holding the copy.',
  tile:'Rounded tiles in a light neutral tint, arranged as a bento grid with even gaps; the CTA tile is filled with the accent colour.',
  bar:'A solid accent-colour bar running the full width along the bottom edge.',
  frame:'A thin 2 px line frame inset from the edges of the canvas.',
  block:'A flat colour block offset behind the image, slightly down and to the side, for a layered paper look.',
  diagblock:'A solid accent-colour block on the left with a diagonal right edge.'
};
function buildPrompt(L,c,mode){
  const {W,H,f}=c,styleKey=L.style;
  const els=L.boxes.filter(b=>NAMES[b.id]).slice().sort((a,b)=>(Math.round(a.y/(c.H*.05))-Math.round(b.y/(c.H*.05)))||(a.x-b.x));
  const decor=[...new Set(L.boxes.filter(b=>DECOR.has(b.id)).map(b=>b.id))];
  const cropSides=c.st.sides.map(s=>({t:'top',b:'bottom',l:'left',r:'right'}[s]));
  const cropTxt=c.st.sides.length?c.st.sides.map(s=>{const px=Math.round((s==='t'||s==='b'?H:W)*c.st.amt/100);return `the ${({t:'top',b:'bottom',l:'left',r:'right'})[s]} ${c.st.amt}% (${px} px)`;}).join(', '):'';
  const fmtName=f.id==='custom'?'custom size':`${f.name}, ${f.use}`;
  const pos=b=>({x_from:pct(b.x/W),x_to:pct((b.x+b.w)/W),y_from:pct(b.y/H),y_to:pct((b.y+b.h)/H),px:Math.round(Math.min(b.w,W))+' x '+Math.round(Math.min(b.h,H))});
  const hier=['headline','image','person','icon','cta'].filter(id=>els.some(b=>b.id===id&&!b.secondary)).map(id=>id==='cta'?'CTA button':NAMES[id].toLowerCase());
  if(mode==='json'){
    const o={task:'Create a static ad creative that follows this layout exactly. Treat it as a wireframe: keep every position and size, then style it.',
      canvas:{width_px:W,height_px:H,aspect_ratio:ratioStr(W,H),format:fmtName},
      style:{name:STYLE_NAME[styleKey],direction:STYLE_BRIEF[styleKey]},
      layout:{name:L.name+(L.variant?' ('+L.variant+')':''),description:L.desc},
      background:BG_BRIEF[c.st.bg],
      crop_zones:c.st.sides.length?{sides:cropSides,size_pct:c.st.amt,rule:'These edges will be cut off. Let the background and full-bleed imagery run into them, but keep all text, the logo, the CTA and any faces outside them.'}:'none',
      coordinates:'Percent of canvas width (x) and height (y), measured from the top-left corner.',
      elements:els.map(b=>{const p=pos(b);return {element:NAMES[b.id],position:where(b,c),x_pct:[p.x_from,p.x_to],y_pct:[p.y_from,p.y_to],size_px:p.px,details:elementBrief(b,L,c)};}),
      design_details:decor.map(d=>DECOR_BRIEF[d]),
      visual_hierarchy:hier.join(' > '),
      rules:rules()};
    if(txt('colours')) o.colours_and_brand=txt('colours');
    return JSON.stringify(o,null,2);
  }
  const lines=[];
  lines.push('Create a static ad creative that follows this layout exactly. Treat it as a wireframe: keep every position and size, then style it.','');
  lines.push('CANVAS',`${W} x ${H} px, ${ratioStr(W,H)} (${fmtName}).`,'');
  lines.push('STYLE',`${STYLE_NAME[styleKey]}. ${STYLE_BRIEF[styleKey]}`,'');
  if(txt('colours')) lines.push('COLOURS AND BRAND',txt('colours'),'');
  lines.push('LAYOUT',`${L.name}${L.variant?' ('+L.variant+')':''}. ${L.desc}`,'');
  lines.push('BACKGROUND',BG_BRIEF[c.st.bg],'');
  lines.push('CROP ZONES',c.st.sides.length?`${cap(cropTxt)} will be cut off later. Let the background and any full-bleed imagery run into ${c.st.sides.length>1?'these zones':'this zone'}, but keep all text, the logo, the CTA and any faces completely outside them.`:'None. Keep a comfortable margin of about 5% on every side.','');
  lines.push('ELEMENTS (x and y as % of canvas width and height, measured from the top-left corner)');
  els.forEach((b,i)=>{const p=pos(b);lines.push(`${i+1}. ${NAMES[b.id]}: ${where(b,c)}, x ${p.x_from}% to ${p.x_to}%, y ${p.y_from}% to ${p.y_to}% (about ${p.px} px). ${elementBrief(b,L,c)}`);});
  lines.push('');
  if(decor.length){lines.push('DESIGN DETAILS');decor.forEach(d=>lines.push('- '+DECOR_BRIEF[d]));lines.push('');}
  if(hier.length>1) lines.push('VISUAL HIERARCHY',`The eye should land on the ${hier.join(', then the ')}.`,'');
  lines.push('RULES');rules().forEach(r=>lines.push('- '+r));
  return lines.join('\n');
}
function rules(){return ['Use only the elements listed above. Do not add extra text, icons, logos or decorations.','Render any quoted text exactly as written, spelled correctly. Show bracketed text as short placeholder copy.','Keep text sharp and easy to read, with strong contrast against what sits behind it.','Align elements to a clean grid with consistent spacing and margins.','Do not draw these instructions, the percentages, labels or wireframe boxes in the image.'];}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

/* ---------- UI rendering ---------- */
const $=id=>document.getElementById(id);
let layouts=[],ctx=null;
function chip(group,id,label,iconHTML,pressed,sub,extra){return `<button type="button" class="chip${extra||''}" data-group="${group}" data-id="${id}" aria-pressed="${pressed}">${iconHTML}<span class="chip-label">${esc(label)}</span>${sub?`<span class="chip-sub">${esc(sub)}</span>`:''}</button>`;}
function renderControls(){
  const f=currentFormat();
  $('chips-size').innerHTML=FORMATS.map(x=>chip('fmt',x.id,x.name,x.id==='custom'?icon('amt'):ratioIcon(x.w,x.h),state.fmt===x.id,x.id==='custom'?'any size':`${x.w} × ${x.h}`)).join('')+
    (state.fmt==='custom'?`<div class="custom-size"><input id="cw" type="number" min="50" max="10000" value="${clampDim(state.cw)}" aria-label="Custom width in pixels"><span>×</span><input id="ch" type="number" min="50" max="10000" value="${clampDim(state.ch)}" aria-label="Custom height in pixels"><span>px</span></div>`:'');
  $('chips-els').innerHTML=ELEMENTS.map(([id,n])=>chip('els',id,n,icon(id),state.els.includes(id))).join('');
  $('chips-bg').innerHTML=BACKGROUNDS.map(([id,n])=>chip('bg',id,n,icon(id),state.bg===id)).join('');
  $('chips-style').innerHTML=STYLES.map(([id,n])=>chip('style',id,n,icon(id),state.style===id)).join('');
  const sides=[['t','Top'],['b','Bottom'],['l','Left'],['r','Right']];
  $('chips-bleed').innerHTML=chip('bleed','none','No crop',icon('none'),state.sides.length===0)+sides.map(([id,n])=>chip('side',id,n,icon('side_'+id),state.sides.includes(id))).join('')+
    '<span class="divider" aria-hidden="true"></span>'+[5,10,15,20].map(a=>{const px=state.sides.length?Math.round((state.sides[0]==='t'||state.sides[0]==='b'?f.h:f.w)*a/100)+' px':'amount';return chip('amt',a,a+'%',icon('amt'),state.amt===a&&state.sides.length>0,px);}).join('');
}
/* ---------- favourites (saved in this browser's local storage) ---------- */
const FAV_KEY='layoutlab.favs.v1';
let favs=[];
try{const f=JSON.parse(localStorage.getItem(FAV_KEY)||'[]');if(Array.isArray(f)) favs=f.filter(x=>x&&x.uid&&x.st);}catch(e){}
function saveFavs(){try{localStorage.setItem(FAV_KEY,JSON.stringify(favs));return true;}catch(e){toast('Could not save favourites in this browser (storage is blocked).');return false;}}
function snap(st){return {fmt:st.fmt,cw:clampDim(st.cw),ch:clampDim(st.ch),els:st.els.slice().sort(),bg:st.bg,style:st.style,sides:st.sides.slice().sort(),amt:st.amt};}
function favKey(uid,st){return uid+'|'+JSON.stringify(snap(st));}
const isFav=key=>favs.some(f=>f.key===key);
function settingsLine(c){const st=c.st,f=c.f;const crop=st.sides.length?`crop ${st.amt}% ${st.sides.map(s=>({t:'top',b:'bottom',l:'left',r:'right'})[s]).join(', ')}`:'no crop';
  return `${f.id==='custom'?'Custom':f.name} ${c.W} × ${c.H} · ${BACKGROUNDS.find(b=>b[0]===st.bg)[1].toLowerCase()} · ${crop}`;}
const STAR='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg>';

let items=[],selKey=null;
function cardHTML(it,i){const L=it.L,fav=isFav(it.key);
  return `<div class="card${it.key===selKey?' is-selected':''}" role="button" tabindex="0" data-key="${esc(it.key)}" aria-label="Open ${esc(L.name)}">
    <div class="card-preview">${renderSVG(L,it.c,{prefix:'g'+i+'-'})}</div>
    <div class="card-foot"><div class="card-name">${esc(L.name)}<span class="card-tag">${L.variant?esc(cap(L.variant))+' · ':''}${esc(STYLE_NAME[L.style])}</span>${it.sub?`<span class="card-tag">${esc(it.sub)}</span>`:''}</div>
    <div class="card-actions"><button type="button" class="icon-btn star-btn" data-star="${esc(it.key)}" aria-pressed="${fav}" aria-label="${fav?'Remove from':'Add to'} favourites" title="${fav?'Remove from':'Add to'} favourites">${STAR}</button>
    <button type="button" class="icon-btn" data-copy="${esc(it.key)}" aria-label="Copy prompt for ${esc(L.name)}">${icon('copy')}Copy</button></div></div></div>`;}
function renderTabs(){const t=state.tab==='fav'?'fav':'all';
  $('tab-all').setAttribute('aria-selected',t==='all');$('tab-fav').setAttribute('aria-selected',t==='fav');
  $('fav-count').textContent=favs.length;}
function renderResults(){
  ctx=makeCtx();layouts=generate(ctx);
  const c=ctx,nEl=state.els.length;
  $('summary').textContent=`${c.W} × ${c.H} · ${nEl} element${nEl===1?'':'s'} · ${STYLE_NAME[state.style]}`;
  renderTabs();
  if(state.tab==='fav'){
    items=favs.map(f=>{const fc=makeCtx(f.st);const L=generate(fc).find(x=>x.uid===f.uid);return L?{key:f.key,L,c:fc,sub:settingsLine(fc)}:null;}).filter(Boolean);
    $('res-count').textContent=items.length?`${items.length} favourite${items.length===1?'':'s'}`:'No favourites yet';
    $('res-sub').textContent='Each favourite keeps the size, elements, background and crop it was saved with.';
    if(!items.length){$('grid').innerHTML='<div class="empty">Tap the star on any layout in All layouts to save it here. Favourites stay in this browser after a refresh.</div>';return syncDrawer();}
  }else{
    items=layouts.map(L=>({key:favKey(L.uid,state),L,c}));
    $('res-count').textContent=layouts.length?`${layouts.length} layout${layouts.length===1?'':'s'}`:'No layouts yet';
    $('res-sub').textContent=settingsLine(c)+(c.banner?' · banner layouts for very wide sizes':'');
    if(!layouts.length){$('grid').innerHTML=`<div class="empty">${nEl?'None of the layouts in this style fit the chosen elements. Add a hero image, person or illustration, or switch the style to All styles.':'Pick at least one element above, such as a headline and a CTA button, to see layouts.'}</div>`;return syncDrawer();}
  }
  $('grid').innerHTML=items.map(cardHTML).join('');
  syncDrawer();
}
function syncDrawer(){if(selKey&&$('drawer').classList.contains('open')){const it=items.find(x=>x.key===selKey);if(it) fillDrawer(it);else closeDrawer();}}
function renderAll(){renderControls();renderResults();save();}
function toggleFav(key){
  const i=favs.findIndex(f=>f.key===key);
  if(i>=0){favs.splice(i,1);if(saveFavs()) toast('Removed from favourites');}
  else{const it=items.find(x=>x.key===key);if(!it) return;favs.unshift({key,uid:it.L.uid,st:snap(it.c.st),name:it.L.name,added:Date.now()});if(saveFavs()) toast('Added to favourites');}
  renderResults();updateDrawerStar();
}

/* ---------- drawer ---------- */
let lastFocus=null;
function openDrawer(key){const it=items.find(x=>x.key===key);if(!it) return;selKey=key;lastFocus=document.activeElement;
  document.querySelectorAll('.card').forEach(el=>el.classList.toggle('is-selected',el.dataset.key===key));
  fillDrawer(it);$('backdrop').hidden=false;const d=$('drawer');d.classList.add('open');d.setAttribute('aria-hidden','false');setTimeout(()=>$('d-copy').focus(),60);}
function closeDrawer(){const d=$('drawer');d.classList.remove('open');d.setAttribute('aria-hidden','true');$('backdrop').hidden=true;if(lastFocus&&lastFocus.focus&&document.contains(lastFocus)) lastFocus.focus();}
function updateDrawerStar(){const on=selKey&&isFav(selKey);const b=$('d-star');b.setAttribute('aria-pressed',String(!!on));b.lastChild.textContent=on?'Favourite':'Add to favourites';}
function selItem(){return items.find(x=>x.key===selKey);}
function fillDrawer(it){const L=it.L,c=it.c;
  $('d-style').textContent=STYLE_NAME[L.style]+' layout';$('d-title').textContent=L.name+(L.variant?' · '+L.variant:'');
  $('d-preview').innerHTML=renderSVG(L,c,{prefix:'d',labels:true});$('d-desc').textContent=L.desc;
  const show=(w,on)=>{$(w).hidden=!on;};show('w-headline',L.boxes.some(b=>b.id==='headline'));show('w-subheadline',L.boxes.some(b=>b.id==='subheadline'));show('w-cta',L.boxes.some(b=>b.id==='cta'));show('w-badge',L.boxes.some(b=>b.id==='badge'));show('w-subject',L.boxes.some(b=>VIS.includes(b.id)));
  ['headline','subheadline','cta','badge','subject','colours'].forEach(k=>{const el=$('f-'+k);if(document.activeElement!==el) el.value=state.text[k]||'';});
  $('fmt-prose').setAttribute('aria-pressed',state.out!=='json');$('fmt-json').setAttribute('aria-pressed',state.out==='json');
  $('d-prompt').value=buildPrompt(L,c,state.out);updateDrawerStar();}

/* ---------- copy ---------- */
let toastT;function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200);}
function copyText(text,fallbackEl){
  const done=()=>toast('Prompt copied. Paste it into your image tool.');
  const fail=()=>{if(fallbackEl){fallbackEl.focus();fallbackEl.select();}toast('Copy was blocked here. The prompt is selected, press Ctrl+C or Cmd+C.');};
  try{if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,fail);else fail();}catch(e){fail();}
}

/* ---------- events ---------- */
document.querySelector('.controls').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b) return;const g=b.dataset.group,id=b.dataset.id;
  if(g==='fmt') state.fmt=id;
  else if(g==='els'){const i=state.els.indexOf(id);if(i>=0) state.els.splice(i,1);else state.els.push(id);}
  else if(g==='bg') state.bg=id;
  else if(g==='style') state.style=id;
  else if(g==='bleed') state.sides=[];
  else if(g==='side'){const i=state.sides.indexOf(id);if(i>=0) state.sides.splice(i,1);else state.sides.push(id);}
  else if(g==='amt'){state.amt=+id;if(!state.sides.length) state.sides=['t','b'];}
  renderAll();
  const again=document.querySelector(`.chip[data-group="${g}"][data-id="${id}"]`);if(again) again.focus();
});
document.querySelector('.controls').addEventListener('input',e=>{
  if(e.target.id==='cw'||e.target.id==='ch'){const v=+e.target.value;if(!v||v<50) return;state[e.target.id]=v;renderResults();save();}
});
document.querySelector('.controls').addEventListener('change',e=>{if(e.target.id==='cw'||e.target.id==='ch'){state[e.target.id]=clampDim(e.target.value);e.target.value=state[e.target.id];renderResults();save();}});
$('grid').addEventListener('click',e=>{
  const st=e.target.closest('[data-star]');if(st){e.stopPropagation();toggleFav(st.dataset.star);return;}
  const cp=e.target.closest('[data-copy]');
  if(cp){e.stopPropagation();const it=items.find(x=>x.key===cp.dataset.copy);if(it) copyText(buildPrompt(it.L,it.c,state.out),null);return;}
  const card=e.target.closest('.card');if(card) openDrawer(card.dataset.key);
});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openDrawer(e.target.dataset.key);}});
$('tab-all').addEventListener('click',()=>{state.tab='all';renderResults();save();});
$('tab-fav').addEventListener('click',()=>{state.tab='fav';renderResults();save();});
$('d-star').addEventListener('click',()=>{if(selKey) toggleFav(selKey);});
$('d-close').addEventListener('click',closeDrawer);$('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('drawer').classList.contains('open')) closeDrawer();});
['headline','subheadline','cta','badge','subject','colours'].forEach(k=>$('f-'+k).addEventListener('input',e=>{state.text[k]=e.target.value;const it=selItem();if(it) $('d-prompt').value=buildPrompt(it.L,it.c,state.out);save();}));
$('fmt-prose').addEventListener('click',()=>{state.out='prose';const it=selItem();if(it) fillDrawer(it);save();});
$('fmt-json').addEventListener('click',()=>{state.out='json';const it=selItem();if(it) fillDrawer(it);save();});
$('d-copy').addEventListener('click',()=>copyText($('d-prompt').value,$('d-prompt')));

/* ---------- light / dark switch ---------- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
function currentTheme(){const a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light') return a;return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
function showTheme(){const dark=currentTheme()==='dark';$('theme-switch').setAttribute('aria-checked',String(dark));$('theme-label').textContent=dark?'Dark mode':'Light mode';$('theme-knob').innerHTML=dark?MOON:SUN;}
try{const t=localStorage.getItem('layoutlab.theme');if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t);}catch(e){}
$('theme-switch').addEventListener('click',()=>{const next=currentTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('layoutlab.theme',next);}catch(e){}showTheme();});
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',showTheme);}catch(e){}}
showTheme();

renderAll();
})();
</script>
</body></html>
